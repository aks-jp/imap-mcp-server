name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.2@sha256:572d22796908375678119a13fabfcdc5416c9003404ab975fe824692fe02ba03
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imaps
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.auth.disabled=false
            -Dgreenmail.users=support:support-secret@example.com,info:info-secret@example.org,writer:writer-secret@example.net
            -Dgreenmail.verbose=false
        ports:
          - 3993:3993
          - 3980:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for GreenMail
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3980/api/user >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: pytest -v -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t imap-mcp:ci .
      - name: Container starts and /health answers
        run: |
          mkdir -p /tmp/cfg
          printf 'accounts:\n  - {id: demo, host: imap.example.com, username: demo, password_env: MAIL_DEMO_PASSWORD}\n' > /tmp/cfg/accounts.yaml
          docker run -d --name imap-mcp --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e MAIL_DEMO_PASSWORD=x -v /tmp/cfg/accounts.yaml:/config/accounts.yaml:ro -p 127.0.0.1:8000:8000 imap-mcp:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs imap-mcp
          exit 1
