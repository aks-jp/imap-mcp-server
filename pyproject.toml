[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "imap-mcp"
dynamic = ["version"]
description = "IMAP mailboxes as an MCP server over Streamable HTTP (read-only by default)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "imapclient==4.1.0",
    "html2text==2025.4.15",
    "pypdf==6.19.0",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
imap-mcp = "imap_mcp.server:main"

[tool.hatch.version]
path = "src/imap_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imap_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["imap: needs the GreenMail test server (docker compose --profile test up -d greenmail)"]
